# =============================================================================
# docker-compose.prod.yml — GPCG Production Stack
#
# Usage:   docker compose -f docker-compose.prod.yml up -d
# VPS path: /opt/gpcg/docker-compose.prod.yml
#
# Services:
#   api     — GPCG API + frontend (port 8787) — Control Plane only
#   catalog — Game Catalog Service (IGDB sync + query API, port 8788)
#   redis   — Redis 7 (events pub/sub, job queue streams, cache)
#
# No worker on VPS — heavy processing (VLM, ASR, video-generate, Ollama)
# runs on the local GPU PC via `gpcg remote-worker` (Compute Plane).
# The VPS only orchestrates jobs; the remote worker claims and processes them.
#
# No postgres — uses SQLite (data/gpcg.db + data/catalog.db) for simplicity.
# No nginx — trivestia-nginx handles reverse proxying via /gpcg/ prefix.
# The api container connects to trivestia-net so trivestia-nginx can reach it.
# The catalog container is internal-only (not exposed publicly); the api
# proxies /gpcg/api/catalog/* to it.
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    container_name: gpcg-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - gpcg-redis-data:/data
    networks:
      - trivestia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpcg-api:latest
    container_name: gpcg-api
    restart: unless-stopped
    env_file: .env
    environment:
      GPCG_ENV: production
      GPCG_HOST: 0.0.0.0
      GPCG_PORT: 8787
      BI_IDENTITY_URL: http://bi-api:3300
      REDIS_URL: redis://redis:6379/0
      # ── Editorial Intelligence V2 ────────────────────────────────────────
      GPCG_EDITORIAL_BRIEF_ENABLED: "true"
      GPCG_COMPOSITE_SCORING_ENABLED: "true"
      GPCG_DIVERSITY_ENGINE_ENABLED: "true"
      GPCG_FEEDBACK_LOOP_ENABLED: "true"
      GPCG_EDITORIAL_EXPLORATION_FACTOR: "0.1"
    expose:
      - "8787"
    volumes:
      - gpcg-data:/app/data
    networks:
      - trivestia-net
      - bi-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8787/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpcg-api:latest
    container_name: gpcg-catalog
    restart: unless-stopped
    env_file: .env
    environment:
      GPCG_ENV: production
      # IGDB credentials are read from .env (IGDB_CLIENT_ID, IGDB_CLIENT_SECRET)
      CATALOG_DB_PATH: /app/data/catalog.db
    volumes:
      - gpcg-data:/app/data
    networks:
      - trivestia-net
      - bi-net
    command: ["gpcg", "catalog"]
    expose:
      - "8788"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8788/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  trivestia-net:
    external: true
  bi-net:
    external: true

volumes:
  gpcg-data:
    external: true
    name: gpcg_gpcg-data
  gpcg-redis-data:
