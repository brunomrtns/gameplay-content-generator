# =============================================================================
# docker-compose.prod.yml — GPCG Production Stack
#
# Usage:   docker compose -f docker-compose.prod.yml up -d
# VPS path: /opt/gpcg/docker-compose.prod.yml
#
# Services:
#   api     — GPCG API + frontend (port 8787)
#   worker  — Background job processor (inbox watcher + job runner)
#   catalog — Game Catalog Service (IGDB sync + query API, port 8788)
#
# No postgres — uses SQLite (data/gpcg.db + data/catalog.db) for simplicity.
# No nginx — trivestia-nginx handles reverse proxying via /gpcg/ prefix.
# The api container connects to trivestia-net so trivestia-nginx can reach it.
# The catalog container is internal-only (not exposed publicly); the api
# proxies /gpcg/api/catalog/* to it.
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpcg-api:latest
    container_name: gpcg-api
    restart: unless-stopped
    env_file: .env
    environment:
      GPCG_ENV: production
      GPCG_HOST: 0.0.0.0
      GPCG_PORT: 8787
      BI_IDENTITY_URL: http://bi-api:3300
      # ── Editorial Intelligence V2 ────────────────────────────────────────
      GPCG_EDITORIAL_BRIEF_ENABLED: "true"
      GPCG_COMPOSITE_SCORING_ENABLED: "true"
      GPCG_DIVERSITY_ENGINE_ENABLED: "true"
      GPCG_FEEDBACK_LOOP_ENABLED: "true"
      GPCG_EDITORIAL_EXPLORATION_FACTOR: "0.1"
    expose:
      - "8787"
    volumes:
      - gpcg-data:/app/data
    networks:
      - trivestia-net
      - bi-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8787/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpcg-api:latest
    container_name: gpcg-worker
    restart: unless-stopped
    env_file: .env
    environment:
      GPCG_ENV: production
      # ── Editorial Intelligence V2 ────────────────────────────────────────
      GPCG_EDITORIAL_BRIEF_ENABLED: "true"
      GPCG_COMPOSITE_SCORING_ENABLED: "true"
      GPCG_DIVERSITY_ENGINE_ENABLED: "true"
      GPCG_FEEDBACK_LOOP_ENABLED: "true"
      GPCG_EDITORIAL_EXPLORATION_FACTOR: "0.1"
      # Disable inbox watcher on VPS — inbox is local to the GPU PC.
      # The VPS worker only processes jobs queued by the API.
      GPCG_INBOX_WATCHER_ENABLED: "false"
    volumes:
      - gpcg-data:/app/data
    networks:
      - trivestia-net
      - bi-net
    command: ["gpcg", "worker"]
    # Worker não serve HTTP — usa healthcheck de processo em vez de HTTP.
    # Verifica se o processo principal (gpcg worker) está rodando.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.exists('/proc/1/cmdline') and b'gpcg' in open('/proc/1/cmdline', 'rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  catalog:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpcg-api:latest
    container_name: gpcg-catalog
    restart: unless-stopped
    env_file: .env
    environment:
      GPCG_ENV: production
      # IGDB credentials are read from .env (IGDB_CLIENT_ID, IGDB_CLIENT_SECRET)
      CATALOG_DB_PATH: /app/data/catalog.db
    volumes:
      - gpcg-data:/app/data
    networks:
      - trivestia-net
      - bi-net
    command: ["gpcg", "catalog"]
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8788/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  trivestia-net:
    external: true
  bi-net:
    external: true

volumes:
  gpcg-data:
    external: true
    name: gpcg_gpcg-data
